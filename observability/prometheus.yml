global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local
    service: amrutam

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: amrutam-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
        labels:
          component: api

  # The worker exposes the same registry (queue depth, outbox lag, job outcomes).
  - job_name: amrutam-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:3001']
        labels:
          component: worker

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
